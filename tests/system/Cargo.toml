[package]
name = "sisa-messaging-system-tests"
version = "0.0.0"
description = "Real PostgreSQL, JetStream, and Apache Iggy system proofs of the typed consumer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
# Contracts, the generic consumer runtime, and the concrete providers it composes.
sisa-messaging = { workspace = true, features = ["json"] }
sisa-messaging-consumer = { workspace = true }
sisa-messaging-inbox = { workspace = true }
sisa-messaging-iggy = { workspace = true }
sisa-messaging-nats = { workspace = true }
sisa-messaging-postgres = { workspace = true }

# Test-owned broker connections, pool, effect table, runtime, and cancellation. The raw Iggy
# client provisions the test's topic and consumer group, which the library never creates.
async-nats = { workspace = true }
iggy = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }

# Derives the JSON test message.
serde = { workspace = true }

[[test]]
name = "iggy_postgres"
path = "iggy_postgres.rs"

[[test]]
name = "nats_postgres"
path = "nats_postgres.rs"

[lints]
workspace = true
