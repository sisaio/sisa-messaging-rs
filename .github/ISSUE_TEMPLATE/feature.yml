name: Feature request
description: Propose a focused, user-visible capability
labels:
  - type:feature
  - needs:triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. Check the [documentation index](https://github.com/sisaio/sisa-messaging-rs/blob/main/docs/README.md)
        first: the architecture documents define the project's scope and non-goals.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Core messaging model (sisa-messaging)
        - Outbox
        - Inbox
        - Consumer runtime
        - PostgreSQL provider
        - NATS provider
        - CI or repository automation
        - Release or packaging
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and motivation
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and a representative usage example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they fall short.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility concerns
      description: Public API, schema, migration, or wire-format impact you are aware of.
  - type: textarea
    id: context
    attributes:
      label: Additional context
