name: Bug report
description: Something doesn't work as the docs say.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't open an issue: report it privately as
        [SECURITY.md](https://github.com/sisaio/sisa-messaging-rs/blob/main/SECURITY.md) explains.
  - type: dropdown
    id: crate
    attributes:
      label: Crate
      options:
        - sisa-messaging
        - sisa-messaging-core
        - sisa-messaging-runtime
        - sisa-messaging-nats
        - sisa-messaging-postgres
        - sisa-messaging-testing
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crate version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show it.
      render: rust
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors and logs
      description: The error, and logs with `RUST_LOG=sisa_messaging=debug` if you can. Debug logs show subjects and message ids, and this issue is public, so replace any you don't want seen.
      render: text
  - type: input
    id: server
    attributes:
      label: Server
      description: The transport and database involved, their versions, and how they run (one server, a cluster).
      placeholder: "NATS 2.15 with JetStream, PostgreSQL 18"
  - type: input
    id: environment
    attributes:
      label: Rust version and OS
      placeholder: "rustc 1.94.0, Linux x86_64"
    validations:
      required: true
