name: Implementation task
description: Track one bounded implementation outcome
title: ""
labels:
  - type:task
body:
  - type: markdown
    attributes:
      value: |
        **Triage and approval:** Submitting this issue records a Todo item for triage. Do not create or start a Codex implementation task or linked branch until the repository owner explicitly approves it. After approval, the owner provisions one Codex task and moves this issue to In Progress.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the concrete outcome this issue should deliver.
      placeholder: As a ..., I need ... so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable conditions for completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Identify intended paths, dependencies, non-goals, and compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
      description: State what this issue intentionally will not change.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risk assessment
      description: Describe operational, compatibility, security, data, and rollback risks.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Describe the checks that must pass before the pull request is ready.
    validations:
      required: true
