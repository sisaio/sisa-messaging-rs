name: Implementation task
description: Maintainer form for one bounded, reviewable implementation outcome
labels:
  - type:task
body:
  - type: markdown
    attributes:
      value: |
        Maintainers triage new issues in the project's `Todo` column. Implementation, a linked
        branch, or a pull request starts only after the repository owner approves the issue and
        moves it to `In Progress`. Split work with several outcomes or dependencies into a parent
        issue with bounded sub-issues; each sub-issue is approved separately.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and motivation
      description: The concrete outcome this issue delivers and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions for completion.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Intended paths, crates, dependencies, and compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What this issue intentionally does not change.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and controls
      description: Compatibility, schema, concurrency, security, performance, or release risks and how each is controlled.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: The checks and evidence that must exist before the pull request is ready.
    validations:
      required: true
