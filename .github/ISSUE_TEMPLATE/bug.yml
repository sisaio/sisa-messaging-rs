name: Bug report
description: Report a reproducible defect
labels:
  - type:bug
  - needs:triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include credentials, connection URLs, message payloads, raw
        headers, or other sensitive data. Report a security vulnerability through a
        [private security advisory](https://github.com/sisaio/sisa-messaging-rs/security/advisories/new)
        instead of a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Core messaging model (sisa-messaging)
        - Outbox
        - Inbox
        - Consumer runtime
        - PostgreSQL provider
        - NATS provider
        - CI or repository automation
        - Release or packaging
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Crate version or commit SHA, plus the Rust toolchain and PostgreSQL or NATS version when relevant.
      placeholder: "sisa-messaging 0.1.0, rustc 1.95, PostgreSQL 18.1"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Describe the defect and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest reliable reproduction, including commands, code, or configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Operating system, deployment shape, and sanitized logs.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
