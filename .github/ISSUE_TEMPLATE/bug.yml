name: Bug report
description: Report a reproducible defect
title: "bug: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        **Triage and approval:** Submitting this issue records a Todo item for triage. Do not create or start a Codex implementation task or linked branch until the repository owner explicitly approves it. After approval, the owner provisions one Codex task and moves this issue to In Progress.
  - type: textarea
    id: objective
    attributes:
      label: Outcome and impact
      description: Describe the defect, who it affects, and the outcome expected from fixing it.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable reproduction, including relevant commands or inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that prove the defect is fixed.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Identify intended paths, dependencies, and compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
      description: State what this issue intentionally will not change.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risk assessment
      description: Describe operational, compatibility, security, data, and rollback risks.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include versions and sanitized logs. Never include credentials, tokens, or private payloads.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Describe the checks that must pass before the pull request is ready.
    validations:
      required: true
