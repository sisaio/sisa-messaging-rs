# Keeps SHA-pinned actions and Cargo dependencies current. Pull requests opened by Dependabot are
# exempt from the issue-linked branch and commit rules (see CONTRIBUTING.md); every other CI job
# still runs on them and a maintainer merges them manually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - area:ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
