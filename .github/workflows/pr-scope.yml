name: PR scope

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-path-limits:
    name: Changed path limits
    # Dependabot branches cannot carry an approved issue number; see CONTRIBUTING.md.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_API_URL: ${{ github.api_url }}
      GH_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Test changed-path policy boundaries
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run changed-path policy tests
        run: tests/governance/pr-scope.sh

      - name: Enforce branch, commit, and path policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          source .github/scripts/pr-scope-policy.sh

          api_get() {
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$1"
          }

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ || ! "${PR_COMMIT_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "GitHub supplied invalid pull-request metadata." >&2
            exit 1
          fi

          if ! [[ "${PR_HEAD_REF}" =~ ${allowed_branch_pattern} ]]; then
            echo "Invalid pull-request branch name." >&2
            echo "Expected <type>/<issue-number>-<short-kebab-description>; received a ref that does not satisfy repository policy." >&2
            exit 1
          fi

          branch_issue_number="${BASH_REMATCH[2]}"
          pull_url="${GH_API_URL}/repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}"
          pull_request="$(api_get "${pull_url}")"
          pull_body="$(jq --exit-status --raw-output \
            'if (type == "object" and (.body == null or (.body | type) == "string")) then (.body // "") else error("expected pull request object with body") end' \
            <<<"${pull_request}")"

          shopt -s nocasematch
          closing_reference_pattern="(^|[^[:alnum:]_])Closes[[:space:]]+#${branch_issue_number}([^[:alnum:]_]|$)"
          if ! has_closing_reference "${pull_body}" "${branch_issue_number}"; then
            echo "PR body must contain a closing reference for issue #${branch_issue_number}, matching its branch." >&2
            echo "Use canonical syntax: Closes #${branch_issue_number}" >&2
            exit 1
          fi

          issue_url="${GH_API_URL}/repos/${GH_REPOSITORY}/issues/${branch_issue_number}"
          issue="$(api_get "${issue_url}")"
          issue_number="$(jq --exit-status --raw-output \
            'if (type == "object" and (.number | type) == "number") then (.number | tostring) else error("expected issue object") end' \
            <<<"${issue}")"
          issue_state="$(jq --exit-status --raw-output \
            'if (type == "object" and (.state | type) == "string") then .state else error("expected issue state") end' \
            <<<"${issue}")"
          has_pull_request="$(jq --exit-status --raw-output 'if has("pull_request") then "true" else "false" end' <<<"${issue}")"
          if ! issue_is_open_not_pull_request "${issue_number}" "${branch_issue_number}" "${issue_state}" "${has_pull_request}"; then
            echo "Branch issue #${branch_issue_number} must resolve to an existing open GitHub issue, not a pull request." >&2
            exit 1
          fi

          pr_files_url="${GH_API_URL}/repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}/files"
          pr_files="$(api_get "${pr_files_url}?per_page=$((max_pr_paths + 1))&page=1")"
          pr_path_count="$(jq --exit-status 'if type == "array" then length else error("expected array") end' <<<"${pr_files}")"

          if ! path_count_within_limit "${pr_path_count}"; then
            echo "PR #${PR_NUMBER} changes at least ${pr_path_count} paths; the hard limit is ${max_pr_paths}." >&2
            echo "Split the work into smaller capability-focused PRs." >&2
            exit 1
          fi

          if ! commit_count_within_limit "${PR_COMMIT_COUNT}"; then
            echo "PR #${PR_NUMBER} has ${PR_COMMIT_COUNT} commits; GitHub's List commits on a pull request API caps results at ${max_pr_commits_from_api} total commits, even with pagination." >&2
            echo "The workflow cannot prove every commit is within the ${max_commit_paths}-path limit. Rebase or split the PR." >&2
            exit 1
          fi

          page_count=$(((PR_COMMIT_COUNT + 99) / 100))
          observed_commits=0
          violating_commits=0
          violating_messages=0

          for ((page = 1; page <= page_count; page += 1)); do
            commits_url="${GH_API_URL}/repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}/commits"
            commits="$(api_get "${commits_url}?per_page=100&page=${page}")"

            while IFS= read -r sha; do
              if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "GitHub supplied an invalid commit SHA: ${sha}" >&2
                exit 1
              fi

              commit_url="${GH_API_URL}/repos/${GH_REPOSITORY}/commits/${sha}"
              commit="$(api_get "${commit_url}?per_page=$((max_commit_paths + 1))&page=1")"
              commit_header="$(
                jq --exit-status --raw-output \
                  'if (type == "object" and (.commit | type) == "object" and (.commit.message | type) == "string") then
                    (.commit.message | split("\n")[0])
                  else
                    error("expected commit object with message")
                  end' \
                  <<<"${commit}"
              )"
              commit_message="$(jq --exit-status --raw-output \
                'if (type == "object" and (.commit | type) == "object" and (.commit.message | type) == "string") then .commit.message else error("expected commit object with message") end' \
                <<<"${commit}")"
              commit_path_count="$(
                jq --exit-status \
                  'if (type == "object" and ((.files | type) == "array")) then
                    (.files | length)
                  else
                    error("expected commit object with files array")
                  end' \
                  <<<"${commit}"
              )"
              observed_commits=$((observed_commits + 1))

              if ! [[ "${commit_header}" =~ ${conventional_header_pattern} ]]; then
                echo "Commit ${sha:0:12} has an invalid Conventional Commit header." >&2
                violating_messages=$((violating_messages + 1))
              elif [[ "${PR_HEAD_REF}" == hotfix/* && "${BASH_REMATCH[1]}" != "fix" ]]; then
                echo "Commit ${sha:0:12} uses type ${BASH_REMATCH[1]}; commits on hotfix/* must use fix." >&2
                violating_messages=$((violating_messages + 1))
              fi

              if ! has_refs_reference "${commit_message}" "${branch_issue_number}"; then
                echo "Commit ${sha:0:12} must contain a standalone Refs #${branch_issue_number} line." >&2
                violating_messages=$((violating_messages + 1))
              fi
              if has_closing_keyword "${commit_message}"; then
                echo "Commit ${sha:0:12} must not use GitHub closing keywords; use Refs #${branch_issue_number}." >&2
                violating_messages=$((violating_messages + 1))
              fi

              if ! commit_path_count_within_limit "${commit_path_count}"; then
                echo "Commit ${sha:0:12} changes at least ${commit_path_count} paths; the hard limit is ${max_commit_paths}." >&2
                violating_commits=$((violating_commits + 1))
              else
                echo "Commit ${sha:0:12}: ${commit_path_count}/${max_commit_paths} changed paths."
              fi
            done < <(
              jq --exit-status --raw-output \
                'if type == "array" then .[].sha else error("expected array") end' \
                <<<"${commits}"
            )
          done

          if ((observed_commits != PR_COMMIT_COUNT)); then
            echo "Expected ${PR_COMMIT_COUNT} commits but GitHub returned ${observed_commits}; refusing a partial audit." >&2
            exit 1
          fi

          if ((violating_commits > 0)); then
            echo "${violating_commits} commit(s) exceed the changed-path hard limit." >&2
            exit 1
          fi

          if ((violating_messages > 0)); then
            echo "${violating_messages} commit(s) violate the commit-message policy." >&2
            exit 1
          fi

          echo "PR #${PR_NUMBER}: ${pr_path_count}/${max_pr_paths} changed paths across ${observed_commits} audited commit(s)."
