name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Explicit Atlas Community release; do not change to a floating/latest URL.
  ATLAS_VERSION: v1.3.0
  ATLAS_SHA256: 10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b

jobs:
  quality:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1 action revision
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install pinned Atlas Community CLI
        run: |
          curl --fail --location --retry 3 --output atlas \
            "https://release.ariga.io/atlas/atlas-community-linux-amd64-${ATLAS_VERSION}"
          printf '%s  %s\n' "${ATLAS_SHA256}" atlas | sha256sum --check --status
          chmod +x atlas
          sudo install -m 0755 atlas /usr/local/bin/atlas
          atlas version
      - name: Verify migration checksum without mutating checkout
        run: |
          workdir="$(mktemp -d)"
          cp -R migrations "${workdir}/migrations"
          atlas migrate hash --dir "file://${workdir}/migrations"
          cmp --silent migrations/atlas.sum "${workdir}/migrations/atlas.sum"
      - name: Apply complete migration directory to PostgreSQL 18
        run: |
          ci_database_scheme=postgres
          ci_database_url="${ci_database_scheme}://${PGUSER}@${PGHOST}:${PGPORT}/"
          ci_database_url+="${PGDATABASE}?sslmode=disable"
          atlas migrate apply \
            --dir file://migrations \
            --url "${ci_database_url}"
      - name: Require latest version and zero pending migrations
        run: |
          ci_database_scheme=postgres
          ci_database_url="${ci_database_scheme}://${PGUSER}@${PGHOST}:${PGPORT}/"
          ci_database_url+="${PGDATABASE}?sslmode=disable"
          status_file="$(mktemp)"
          atlas migrate status \
            --dir file://migrations \
            --url "${ci_database_url}" \
            --format '{{ json . }}' >"${status_file}"
          jq -e '
            .Status == "OK"
            and ((.Pending // []) | length == 0)
            and (.Error // "") == ""
          ' "${status_file}" >/dev/null
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: MSRV 1.94
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1 action revision
        with:
          toolchain: 1.94.0
      - run: cargo check --workspace --all-targets --all-features --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1 action revision
        with:
          toolchain: 1.98.0
      - run: cargo tree -d --locked
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check

  architecture:
    name: Architecture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1 action revision
        with:
          toolchain: 1.98.0
      - run: cargo test --test workspace_boundaries --all-features --locked

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      # OSS TruffleHog scans the checked-out Git contents; both its action and image are pinned.
      - uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10 # v3.94.1
        with:
          path: ./
          version: 3.94.1@sha256:c6cae63b2ff9254c5f06848d439e31902de625c14f4771d371deff4106688c60
