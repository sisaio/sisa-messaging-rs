# The commit and branch rules, the Markdown links and the dependency policy; formatting, lints,
# the docs and the MSRV build; breaking API changes; the tests, which run against the newest NATS,
# PostgreSQL, Iggy and Redis, and the Redis transport's tests against Valkey and Dragonfly; and
# coverage on main. The tests start their servers in Docker. PRs and pushes to main that change no
# Rust inputs skip the Rust jobs; `ci` sums them up for the ruleset.
#
# Every sisaio crate repository has the same jobs under the same names: changes, policy, lint,
# semver, test, ci and coverage. The crate names, the MSRV, the facade's features and the servers
# are this repository's own.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Whether the Rust jobs need to run, and the commit and branch checks every PR needs. A PR is
  # diffed against its base and a push to main against the commit before it, so a docs-only merge
  # skips them too.
  # A merge with the same files as its PR's head, which passed CI, skips them as well; coverage
  # still runs on every code change, for the badge. `semver` runs only when a published crate's
  # source or manifest, the lock file, the toolchain or this workflow changes: tests, benches and
  # examples have no public API.
  changes:
    name: changes
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      coverage: ${{ steps.diff.outputs.coverage }}
      api: ${{ steps.diff.outputs.api }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so both checks can read the pushed commits.
          fetch-depth: 0

      - name: Look for code changes
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(.github/scripts/code-changed.sh "$BASE" "$HEAD")
          echo "coverage=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ] && [ "$GITHUB_EVENT_NAME" = push ] \
            && [ "$(.github/scripts/pr-tested.sh "$BASE" "$HEAD")" = true ]; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          api=false
          if git diff --no-renames --name-only "$BASE...$HEAD" | grep -qE \
            '^crates/(core|runtime|nats|iggy|redis|postgres|sisa-messaging)/(src/|Cargo\.toml$)|^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.github/workflows/ci\.yml)$'; then
            api=true
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"

      # The PR's commits and title against CONTRIBUTING.md#commit-messages, with the hook a clone
      # runs. A title edited later is checked on the next push: no run starts on an edit.
      # Dependabot's titles run long, so its PRs are left out.
      - name: Check commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            .githooks/commit-msg "$RUNNER_TEMP/message" || status=1
          done
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/message"
          SUBJECT_ONLY=1 .githooks/commit-msg "$RUNNER_TEMP/message" || status=1
          exit "$status"

      # The PR's branch against CONTRIBUTING.md#branches, with the script the pre-push hook runs.
      - name: Check the branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: .githooks/check-branch "$BRANCH"

  # What needs no build. The links: relative links and #anchors in the Markdown files, hidden
  # folders such as .agents and .github included; .claude only links to .agents. External links
  # stay out, since they flake; rustdoc checks the links in doc comments. The dependency policy:
  # advisories, licenses, bans and sources, as deny.toml sets them, when a Rust input changed.
  policy:
    name: policy
    needs: changes
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny-action's image holds an x64 binary, so the tool is installed instead.
      - name: Install lychee and cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: lychee,cargo-deny

      - name: Check the links
        run: lychee --offline --include-fragments --no-progress --hidden --exclude-path '(^|/)(\.git|\.claude|target)/' './**/*.md'

      - name: Check the dependency policy
        if: needs.changes.outputs.code == 'true'
        run: cargo deny --log-level warn --all-features check

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      MSRV: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Restores ~/.cargo and target/ from main's last run. Only main saves, so PRs don't fill the
      # cache quota. The other jobs below do the same.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Clippy with every feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Alone, so the workspace's other members don't turn its features on.
      - name: Build the facade with each feature
        run: |
          for features in "" nats iggy redis postgres; do
            cargo check -p sisa-messaging --features "$features" --locked
          done

      # docs.rs builds every published crate with every feature; a broken link fails here instead.
      - name: Build the docs
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # The workspace `rust-version`, in MSRV above. Last, so the faster checks fail first. Cargo
      # keeps each compiler's artifacts apart in the one target/.
      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal

      - name: Build at the MSRV
        run: cargo "+$MSRV" check --workspace --all-targets --all-features --locked

  # A change that breaks a published crate's API, against the PR's base, fails unless the PR
  # carries the `breaking` label. The base rather than crates.io, so that a break already merged
  # for the next release doesn't fail every later PR. The label is read when the job runs, so after
  # adding it, re-run the job.
  semver:
    name: semver
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for the breaking label
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          breaking=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "breaking")')
          echo "breaking=$breaking" >> "$GITHUB_OUTPUT"

      - name: Install the pinned toolchain
        if: steps.label.outputs.breaking != 'true'
        run: rustup toolchain install

      - name: Install cargo-semver-checks
        if: steps.label.outputs.breaking != 'true'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-semver-checks

      # Every publishable crate the base already has, with every feature: a new crate has no API
      # to break yet. Each crate is built twice, as it is and at the base, and on its own
      # cargo-semver-checks gives every build a target dir of its own. One shared dir builds the
      # dependencies once instead.
      - name: Check the public API
        if: steps.label.outputs.breaking != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/semver
        run: |
          if ! git cat-file -e "$BASE:Cargo.toml" 2>/dev/null; then
            echo "The base has no workspace yet; nothing to compare."
            exit 0
          fi
          # A crate is matched by name, so one that moved to another folder is still compared.
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE" > /dev/null
          base_names=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path "$RUNNER_TEMP/base/Cargo.toml" | jq -r '.packages[].name')
          names=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name')
          git worktree remove --force "$RUNNER_TEMP/base"
          packages=()
          while read -r name; do
            if grep -qxF -- "$name" <<< "$base_names"; then packages+=(--package "$name"); fi
          done <<< "$names"
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No publishable crate exists in the base yet; nothing to compare."
            exit 0
          fi
          cargo semver-checks "${packages[@]}" --all-features --baseline-rev "$BASE"

  # The newest NATS, PostgreSQL, Iggy and Redis releases only; older servers aren't tested.
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    env:
      NATS_IMAGE: nats:2.15-alpine
      POSTGRES_IMAGE: postgres:18-alpine
      IGGY_IMAGE: apache/iggy:0.10.0
      REDIS_IMAGE: redis:8.10-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest

      # Pulled once here, so no test waits on the download.
      - name: Pull the server images
        run: docker pull "$NATS_IMAGE" && docker pull "$POSTGRES_IMAGE" && docker pull "$IGGY_IMAGE" && docker pull "$REDIS_IMAGE"

      - name: Run all tests including NATS, PostgreSQL, Iggy and Redis
        run: cargo nextest run --profile ci --workspace --all-features --locked

      # nextest doesn't run the examples in doc comments.
      - name: Run the doc tests
        run: cargo test --doc --workspace --all-features --locked

  # The Redis transport's tests on the other servers that speak the Redis protocol, each at its
  # newest release. Redis itself runs in `test`.
  redis-family:
    name: redis-family (${{ matrix.server }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: valkey
            image: valkey/valkey:9.1-alpine
          - server: dragonfly
            image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    env:
      REDIS_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest

      - name: Pull the server image
        run: docker pull "$REDIS_IMAGE"

      - name: Run the Redis transport's tests
        run: cargo nextest run --profile ci -p sisa-messaging-redis --locked

  # The check the main ruleset requires: skipped jobs pass, failed or cancelled ones fail. A skipped
  # job reports no check, so the jobs themselves can't be required directly.
  ci:
    name: ci
    if: always()
    needs: [changes, policy, lint, semver, test, redis-family]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Check the results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Line coverage for the README badge, on main only to keep Actions minutes down. The test
  # helpers crate is left out.
  coverage:
    name: coverage
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      NATS_IMAGE: nats:2.15-alpine
      POSTGRES_IMAGE: postgres:18-alpine
      IGGY_IMAGE: apache/iggy:0.10.0
      REDIS_IMAGE: redis:8.10-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov

      - name: Pull the server images
        run: docker pull "$NATS_IMAGE" && docker pull "$POSTGRES_IMAGE" && docker pull "$IGGY_IMAGE" && docker pull "$REDIS_IMAGE"

      - name: Measure coverage
        run: cargo llvm-cov --workspace --all-features --locked --ignore-filename-regex 'crates/testing/' --lcov --output-path lcov.info

      # A Codecov outage only leaves the badge stale; it doesn't turn main red, which would hold up
      # a release waiting on this run.
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
