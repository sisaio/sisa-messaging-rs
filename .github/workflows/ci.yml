name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Explicit Atlas Community release; do not change to a floating/latest URL.
  ATLAS_VERSION: v1.3.0
  ATLAS_SHA256: 10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b

jobs:
  quality:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      NATS_URL: nats://127.0.0.1:4222
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2f
      RABBITMQ_CONTAINER: ci-rabbitmq
      KAFKA_CONTAINER: ci-kafka
      SISA_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      SISA_KAFKA_TEST_TOPIC: ci-kafka-topic
      SISA_KAFKA_TEST_PARTITIONED_TOPIC: ci-kafka-partitioned-topic
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 action revision
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install pinned Atlas Community CLI
        run: |
          curl --fail --location --retry 3 --output atlas \
            "https://release.ariga.io/atlas/atlas-community-linux-amd64-${ATLAS_VERSION}"
          printf '%s  %s\n' "${ATLAS_SHA256}" atlas | sha256sum --check --status
          chmod +x atlas
          sudo install -m 0755 atlas /usr/local/bin/atlas
          atlas version
      - name: Verify migration checksum without mutating checkout
        run: |
          workdir="$(mktemp -d)"
          cp -R migrations "${workdir}/migrations"
          atlas migrate hash --dir "file://${workdir}/migrations"
          cmp --silent migrations/atlas.sum "${workdir}/migrations/atlas.sum"
      - name: Apply complete migration directory to PostgreSQL 18
        run: |
          ci_database_scheme=postgres
          ci_database_url="${ci_database_scheme}://${PGUSER}@${PGHOST}:${PGPORT}/"
          ci_database_url+="${PGDATABASE}?sslmode=disable"
          atlas migrate apply \
            --dir file://migrations \
            --url "${ci_database_url}"
      - name: Require latest version and zero pending migrations
        run: |
          ci_database_scheme=postgres
          ci_database_url="${ci_database_scheme}://${PGUSER}@${PGHOST}:${PGPORT}/"
          ci_database_url+="${PGDATABASE}?sslmode=disable"
          status_file="$(mktemp)"
          atlas migrate status \
            --dir file://migrations \
            --url "${ci_database_url}" \
            --format '{{ json . }}' >"${status_file}"
          jq -e '
            .Status == "OK"
            and ((.Pending // []) | length == 0)
            and (.Error // "") == ""
          ' "${status_file}" >/dev/null
      - name: Verify SQLx offline metadata
        working-directory: crates/sisa-messaging-postgres
        run: |
          if ! sqlx --version 2>/dev/null | grep -qx 'sqlx-cli 0.9.0'; then
            cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
          fi
          ci_database_scheme=postgres
          ci_database_url="${ci_database_scheme}://${PGUSER}@${PGHOST}:${PGPORT}/"
          ci_database_url+="${PGDATABASE}?sslmode=disable"
          DATABASE_URL="${ci_database_url}" cargo sqlx prepare --check -- --package sisa-messaging-postgres --all-targets
      - run: cargo fmt --all -- --check
      - run: cargo run --locked --quiet --package sisa-messaging-xtask -- blank-lines --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Start NATS JetStream
        run: |
          docker run --detach --name ci-nats \
            --publish 4222:4222 \
            --health-cmd='wget -q -O /dev/null http://127.0.0.1:8222/healthz' \
            --health-interval=2s --health-timeout=2s --health-retries=15 \
            nats:2.11.8-alpine -js -m 8222
          health_status=starting
          health_attempt=0
          while [ "${health_status}" != healthy ] && [ "${health_attempt}" -lt 30 ]; do
            health_status="$(docker inspect --format='{{.State.Health.Status}}' ci-nats)"
            if [ "${health_status}" = unhealthy ]; then
              docker logs ci-nats
              exit 1
            fi
            health_attempt=$((health_attempt + 1))
            sleep 1
          done
          if [ "${health_status}" != healthy ]; then
            docker logs ci-nats
            exit 1
          fi
      - name: Run NATS JetStream integration tests
        run: cargo test -p sisa-messaging-nats --test jetstream --all-features --locked -- --ignored
      - name: Start Kafka (single-node KRaft)
        run: |
          docker run --detach --name "${KAFKA_CONTAINER}" \
            --publish 9092:9092 \
            --env KAFKA_NODE_ID=1 \
            --env KAFKA_PROCESS_ROLES=broker,controller \
            --env KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            --env KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            --env KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            --env KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            --env KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            --env KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            apache/kafka:4.0.0
          health_status=unavailable
          health_attempt=0
          while [ "${health_status}" != healthy ] && [ "${health_attempt}" -lt 30 ]; do
            if docker exec "${KAFKA_CONTAINER}" /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server "${SISA_KAFKA_BOOTSTRAP_SERVERS}" --list >/dev/null 2>&1; then
              health_status=healthy
              break
            fi
            health_attempt=$((health_attempt + 1))
            sleep 1
          done
          if [ "${health_status}" != healthy ]; then
            docker logs "${KAFKA_CONTAINER}"
            exit 1
          fi
      - name: Create Kafka test topics
        run: |
          docker exec "${KAFKA_CONTAINER}" /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "${SISA_KAFKA_BOOTSTRAP_SERVERS}" \
            --create --topic "${SISA_KAFKA_TEST_TOPIC}" \
            --partitions 1 --replication-factor 1
          docker exec "${KAFKA_CONTAINER}" /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "${SISA_KAFKA_BOOTSTRAP_SERVERS}" \
            --create --topic "${SISA_KAFKA_TEST_PARTITIONED_TOPIC}" \
            --partitions 8 --replication-factor 1
      - name: Run PostgreSQL, NATS, and Kafka system tests
        run: cargo test -p sisa-messaging-system-tests --all-features --locked -- --ignored
      - name: Run real Kafka integration tests
        run: |
          cargo test -p sisa-messaging-kafka --all-features --locked \
            --test real_kafka_consumer \
            --test real_kafka_consumer_rebalance \
            --test real_kafka_transactional_fence \
            --test real_kafka_rebalance \
            --test real_kafka_settlement \
            --test real_kafka_confirmed_commit \
            --test real_kafka_publisher \
            -- --ignored --test-threads=1
      - name: Start RabbitMQ
        run: |
          docker run --detach --name "${RABBITMQ_CONTAINER}" \
            --publish 127.0.0.1:5672:5672 \
            rabbitmq:4.1.8-alpine
          health_status=unavailable
          health_attempt=0
          while [ "${health_status}" != healthy ] && [ "${health_attempt}" -lt 30 ]; do
            if docker exec --user rabbitmq "${RABBITMQ_CONTAINER}" rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1; then
              health_status=healthy
              break
            fi
            health_attempt=$((health_attempt + 1))
            sleep 1
          done
          if [ "${health_status}" != healthy ]; then
            docker logs "${RABBITMQ_CONTAINER}"
            exit 1
          fi
      - name: Run RabbitMQ integration tests
        run: cargo test -p sisa-messaging-rabbitmq --test rabbitmq --all-features --locked -- --ignored
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked

  redis-streams:
    name: Redis Streams (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Redis
            image: redis:7
          - provider: Valkey
            image: valkey/valkey:8
          - provider: Dragonfly
            image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    env:
      SISA_REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: ${{ matrix.image }}
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 action revision
        with:
          toolchain: 1.98.0
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Wait for RESP PING
        run: |
          python3 - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 60
          while True:
              try:
                  with socket.create_connection(("127.0.0.1", 6379), timeout=1) as connection:
                      connection.sendall(b"*1\r\n$4\r\nPING\r\n")
                      if connection.recv(16) == b"+PONG\r\n":
                          break
              except OSError:
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit("Redis-compatible service did not answer RESP PING")
              time.sleep(1)
          PY
      - name: Run Redis Streams integration tests
        run: cargo test -p sisa-messaging-redis --features integration --test streams --locked -- --ignored --nocapture

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 action revision
        with:
          toolchain: 1.95.0
      - run: cargo check --workspace --all-targets --all-features --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 action revision
        with:
          toolchain: 1.98.0
      - run: cargo tree -d --locked
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check

  architecture:
    name: Architecture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 action revision
        with:
          toolchain: 1.98.0
      - run: cargo test --test workspace_boundaries --all-features --locked

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # OSS TruffleHog scans the checked-out Git contents; both its action and image are pinned.
      - uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          version: 3.94.1@sha256:c6cae63b2ff9254c5f06848d439e31902de625c14f4771d371deff4106688c60
