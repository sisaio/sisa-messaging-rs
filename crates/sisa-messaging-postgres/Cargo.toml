[package]
name = "sisa-messaging-postgres"
version = "0.1.0"
description = "PostgreSQL runtime providers for Sisa outbox and inbox contracts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Provider contracts.
sisa-messaging = { workspace = true, features = ["serde"] }
sisa-messaging-inbox = { workspace = true }
sisa-messaging-outbox = { workspace = true }

# Time and database support.
chrono = { workspace = true }
sqlx = { workspace = true }

# Identifier primitives.
uuid = { workspace = true }

# Error and serialization support.
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test runtime.
tokio = { workspace = true }

[lints]
workspace = true
