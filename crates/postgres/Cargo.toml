[package]
name = "sisa-messaging-postgres"
description = "The PostgreSQL outbox and inbox of Sisa Messaging, on sqlx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# The tests use sisa-messaging-testing, which isn't published, so a downloaded crate couldn't
# build them.
exclude = ["tests/"]
keywords = ["messaging", "outbox", "inbox", "postgres"]
categories = ["asynchronous", "database"]

[lints]
workspace = true

[dependencies]
# The shared contracts that this crate implements.
sisa-messaging-core = { workspace = true }
# The PostgreSQL client: the caller's connection type, and the store's own pool.
sqlx = { workspace = true }

[dev-dependencies]
# The bus that publishes through the outbox and keeps the partitions, and messages and envelopes
# to publish.
bytes = { workspace = true }
serde = { workspace = true }
sisa-messaging-runtime = { workspace = true }
# The end-to-end dispatch test, from the outbox to a NATS endpoint.
sisa-messaging-nats = { workspace = true }
# A PostgreSQL server per test, in Docker, and sqlx's migrator to run the migrations as sqlx-cli does.
sisa-messaging-testing = { workspace = true }
sqlx = { workspace = true, features = ["migrate"] }
tokio = { workspace = true }

[package.metadata.docs.rs]
all-features = true
