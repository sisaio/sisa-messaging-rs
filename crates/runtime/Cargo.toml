[package]
name = "sisa-messaging-runtime"
description = "The engine of Sisa Messaging: the bus, the receive pipeline, the outbox dispatcher and partition maintenance, for every transport and database"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["messaging", "outbox", "inbox", "async"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[dependencies]
sisa-messaging-core = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
serde = { workspace = true }
sisa-messaging-testing = { workspace = true }
# Paused time, so the retry tests don't wait.
tokio = { workspace = true, features = ["test-util"] }
