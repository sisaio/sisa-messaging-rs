[package]
name = "sisa-messaging-nats"
version = "0.1.0"
description = "NATS JetStream transport provider for Sisa messaging contracts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-nats = { workspace = true }
futures-util = { workspace = true }
opentelemetry = { workspace = true }
sisa-messaging = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

# Consumer composition tests and benchmarks run the generic runtime over this provider with a
# test-local inbox; the runtime dependency graph stays messaging-only.
sisa-messaging-consumer = { workspace = true }
sisa-messaging-inbox = { workspace = true }
tokio-util = { workspace = true }

# Captures instrumentation output to assert payload and header redaction.
tracing-subscriber = { workspace = true }

[[bench]]
name = "mapping"
harness = false

[[bench]]
name = "provider"
harness = false

[[bench]]
name = "consume"
harness = false

[lints]
workspace = true
