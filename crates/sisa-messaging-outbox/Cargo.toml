[package]
name = "sisa-messaging-outbox"
version = "0.1.0"
description = "Transactional outbox contracts and dispatch coordination"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Keep provider identity serialization opt-in.
default = []
serde = ["dep:serde", "uuid/serde"]

[dependencies]
# Portable runtime coordination and cancellation.
tokio = { workspace = true }
tokio-util = { workspace = true }

# Direct diagnostics APIs; applications retain provider and subscriber ownership.
opentelemetry = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Transport-independent envelope contracts and persisted identities.
sisa-messaging = { workspace = true }
uuid = { workspace = true }

# Optional serialization for provider-minted identity carriers.
serde = { workspace = true, optional = true }

[dev-dependencies]
# Deterministic asynchronous protocol tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

# Hot-path microbenchmarks.
criterion = { workspace = true }

# Feature-gated identity round-trip and observability assertions.
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "retry"
harness = false

[[bench]]
name = "dispatcher_core"
harness = false

[lints]
workspace = true
