model = "gpt-6-luna"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
plan_mode_reasoning_effort = "medium"
tool_output_token_limit = 6000
model_auto_compact_token_limit = 100000

# Routine gh, crates.io, and local-database calls no longer escalate to the guardian auto-reviewer,
# which cost 13.4M tokens over 61 runs on 23-24 Sep 2026. Auto review stays on for other escapes.
[sandbox_workspace_write]
network_access = true

[mcp_servers.node_repl]
enabled = false

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "medium"

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

[plugins."unified-computer-use@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false
