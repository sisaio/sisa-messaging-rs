# The dependency policy that `cargo deny check` enforces: advisories, licenses, bans, and sources.
# Adding a license, an advisory exception, or a source needs a reviewed reason beside it.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # astral-tokio-tar is unmaintained (2026-11-03) and has no safe upgrade. Only testcontainers
  # 0.28, the newest, uses it, for the test containers of the unpublished sisa-messaging-testing.
  # Drop this once testcontainers moves off it.
  { id = "RUSTSEC-2026-0440", reason = "test-only, through testcontainers; no upgrade exists" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  # webpki-roots, Mozilla's root certificates, which the iggy client's HTTP and QUIC clients bundle.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
