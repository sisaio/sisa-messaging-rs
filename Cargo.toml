[workspace]
members = [
    "crates/sisa-messaging",
    "crates/sisa-messaging-consumer",
    "crates/sisa-messaging-inbox",
    "crates/sisa-messaging-nats",
    "crates/sisa-messaging-outbox",
    "crates/sisa-messaging-postgres",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/sisaio/sisa-messaging-rs"

[workspace.dependencies]
sisa-messaging = { version = "=0.1.0", path = "crates/sisa-messaging" }
sisa-messaging-consumer = { version = "=0.1.0", path = "crates/sisa-messaging-consumer" }
sisa-messaging-inbox = { version = "=0.1.0", path = "crates/sisa-messaging-inbox" }
sisa-messaging-nats = { version = "=0.1.0", path = "crates/sisa-messaging-nats" }
sisa-messaging-outbox = { version = "=0.1.0", path = "crates/sisa-messaging-outbox" }
sisa-messaging-postgres = { version = "=0.1.0", path = "crates/sisa-messaging-postgres" }

[workspace.lints.rust]
unsafe_code = "forbid"
