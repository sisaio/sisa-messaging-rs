[workspace]
members = ["crates/*", "tests/architecture"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/sisaio/sisa-messaging-rs"

[workspace.dependencies]
# Criterion is the benchmark harness used across workspace crates.
criterion = { version = "0.8.2", default-features = false }

# Tokio and Tokio-util provide asynchronous runtime and cancellation primitives.
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }

# NATS JetStream client and cancel-safe stream utilities.
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }

# Kafka transport client; applications select authentication and protocol features.
rdkafka = { version = "=0.39.0", default-features = false, features = ["tokio"] }

# Error and diagnostics support without subscriber, SDK, or exporter policy.
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
thiserror = { version = "2.0.20", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Test-only subscriber used to assert safe structured instrumentation.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry"] }

# Architecture-test syntax analysis.
proc-macro2 = { version = "1.0.107", default-features = false }
syn = { version = "3.0.5", default-features = false, features = ["full", "parsing", "visit"] }

# Serialization primitives and payload codecs.
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }

# Workspace-local messaging crates include contracts and concrete providers.
sisa-messaging = { version = "=0.1.0", path = "crates/sisa-messaging" }
sisa-messaging-consumer = { version = "=0.1.0", path = "crates/sisa-messaging-consumer" }
sisa-messaging-inbox = { version = "=0.1.0", path = "crates/sisa-messaging-inbox" }
sisa-messaging-kafka = { version = "=0.1.0", path = "crates/sisa-messaging-kafka" }
sisa-messaging-nats = { version = "=0.1.0", path = "crates/sisa-messaging-nats" }
sisa-messaging-outbox = { version = "=0.1.0", path = "crates/sisa-messaging-outbox" }
sisa-messaging-postgres = { version = "=0.1.0", path = "crates/sisa-messaging-postgres" }

# Identifier primitives.
uuid = { version = "1.18.1", default-features = false, features = ["std", "v7"] }

# Time and database support for PostgreSQL providers.
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "uuid"] }

[workspace.lints.rust]
unsafe_code = "forbid"
