# Claude Code harness mapping for the roles in .agents/roles/*.md.
# Read by .agents/sync.sh; do not edit the generated .claude/ files or CLAUDE.md by hand.

# Tier to Claude Code model alias used in .claude/agents/<role>.md frontmatter.
[tiers.flagship]
model = "opus"

[tiers.balanced]
model = "opus"

[tiers.fast]
model = "sonnet"

# Every key here is added to the frontmatter of each role with `write: false`.
[read_only]
disallowedTools = "Edit, Write, NotebookEdit"

# Emitted as .claude/settings.json.
[settings.permissions]
allow = [
  "Bash(rtk *)",
]

# Each [settings.hooks.<Event>] table is emitted as one command hook for <Event> in
# .claude/settings.json. `command` is a TOML literal string, so it holds no single quotes, and
# sync.sh rejects backslashes and tabs in it; `timeout` is a whole number of seconds.
#
# After an edit to a workspace `.rs` file, format it with rustfmt and insert the blank lines
# required by docs/api-conventions.md "Rust presentation". The checkout is resolved from the
# edited file, so edits in a git worktree of the project are fixed with that worktree's tool;
# files in any other repository and paths with `.` or `..` segments are ignored. The separate
# target directory avoids waiting on the build lock held by a concurrent workspace build; the
# hook always exits 0.
[settings.hooks.PostToolUse]
matcher = "Edit|Write"
timeout = 120
command = '{ f=$(jq -r ".tool_input.file_path // empty"); case "$f" in */./* | */../*) exit 0 ;; /*.rs) ;; *) exit 0 ;; esac; [ -n "$CLAUDE_PROJECT_DIR" ] && [ -f "$f" ] || exit 0; root=$(git -C "${f%/*}" rev-parse --show-toplevel) || exit 0; case "$f" in "$root"/*) ;; *) exit 0 ;; esac; common=$(git -C "$root" rev-parse --path-format=absolute --git-common-dir) || exit 0; [ "$common" = "$(git -C "$CLAUDE_PROJECT_DIR" rev-parse --path-format=absolute --git-common-dir)" ] || exit 0; cd "$root" && rustfmt --edition 2024 "$f" && CARGO_TARGET_DIR=target/blank-lines-hook cargo xtask blank-lines --fix "$f"; } >/dev/null 2>&1; exit 0'
